<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 5 - Віджет погоди</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="widget-container">

        <!-- Блок зі стрілками (найнижчий шар) -->
        <div class="nav-arrows">
            <span>&larr;</span>
            <span>&rarr;</span>
        </div>

        <!-- Головна темна картка (середній шар) -->
        <div class="main-card">
            <div class="current-temp">17</div>

            <!-- Підключення картинки хмари.
                 src вказує на назву файлу, alt - альтернативний текст, title - підпис при наведенні -->
            <img src="cloud.png" alt="Хмара" title="Мінлива хмарність" class="cloud-img">
        </div>

        <!-- Світла картка прогнозу (найвищий шар) -->
        <div class="forecast-card">
            <div class="day">
                <span class="day-name">Sun</span>
                <span class="day-temp">17&deg;</span>
            </div>
            <div class="day">
                <span class="day-name">Mon</span>
                <span class="day-temp">19&deg;</span>
            </div>
            <div class="day">
                <span class="day-name">Tue</span>
                <span class="day-temp">16&deg;</span>
            </div>
            <div class="day">
                <span class="day-name">Wed</span>
                <span class="day-temp">18&deg;</span>
            </div>
            <div class="day">
                <span class="day-name">Thu</span>
                <span class="day-temp">21&deg;</span>
            </div>
        </div>

    </div>

</body>
</html>
