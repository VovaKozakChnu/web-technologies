<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 3 - Форма анкети (Козак)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Форма з методом POST та підтримкою відправки файлів[cite: 38] -->
    <form action="" method="post" enctype="multipart/form-data">

        <!-- Блок 1: Особисті дані -->
        <fieldset>
            <legend>Особиста інформація</legend> <!--[cite: 38] -->

            <label for="username">Ім'я користувача:</label> <!--[cite: 38] -->
            <input type="text" name="username" id="username" value="" placeholder="Введіть ім'я" required tabindex="1"> <!--[cite: 37, 38] -->

            <label for="pwd">Пароль (6 символів, мін. 1 велика, 1 мала літери, 1 цифра):</label> <!--[cite: 38] -->
            <input type="password" name="pwd" id="pwd" value="" placeholder="Abc123" required pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{6}" tabindex="2"> <!--[cite: 37, 38] -->

            <label for="email">Email:</label>
            <input type="email" name="user_email" id="email" value="" placeholder="example@mail.com" autocomplete="off" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" tabindex="3"> <!--[cite: 37, 38] -->

            <label for="tel">Мобільний номер:</label>
            <input type="tel" name="phone" id="tel" value="" placeholder="+380XXXXXXXXX" required pattern="\+380[0-9]{9}" tabindex="4"> <!--[cite: 37, 38] -->

            <label for="bday">Дата народження:</label>
            <input type="date" name="birthday" id="bday" value="" tabindex="5"> <!--[cite: 37, 38] -->
        </fieldset>

        <!-- Блок 2: Вибір параметрів -->
        <fieldset>
            <legend>Налаштування профілю</legend> <!--[cite: 38] -->

            <!-- Радіокнопки: Блок 1 (3 значення)[cite: 37] -->
            <p>Оберіть стать:</p>
            <label><input type="radio" name="gender" value="male" tabindex="6"> Чоловіча</label> <!--[cite: 38] -->
            <label><input type="radio" name="gender" value="female" tabindex="7"> Жіноча</label>
            <label><input type="radio" name="gender" value="other" tabindex="8"> Інша</label>

            <!-- Радіокнопки: Блок 2 (3 значення, одне checked)[cite: 37, 38] -->
            <p>Оберіть статус:</p>
            <label><input type="radio" name="status" value="student" tabindex="9"> Студент</label>
            <label><input type="radio" name="status" value="worker" checked tabindex="10"> Працюю</label> <!--[cite: 37] -->
            <label><input type="radio" name="status" value="freelance" tabindex="11"> Фрілансер</label>

            <!-- Чекбокси (4 значення)[cite: 37] -->
            <p>Хобі (можна обрати декілька):</p>
            <label><input type="checkbox" name="hobby" value="sport" tabindex="12"> Спорт</label>
            <label><input type="checkbox" name="hobby" value="music" tabindex="13"> Музика</label>
            <label><input type="checkbox" name="hobby" value="coding" tabindex="14"> Програмування</label>
            <label><input type="checkbox" name="hobby" value="reading" tabindex="15"> Читання</label>
        </fieldset>

        <!-- Блок 3: Списки -->
        <fieldset>
            <legend>Додаткові дані (Списки)</legend> <!--[cite: 38] -->

            <!-- Звичайний список з 5 значень, 3-тє selected[cite: 37] -->
            <label for="city">Ваше місто (5 варіантів):</label>
            <select name="city" id="city" tabindex="16"> <!--[cite: 38] -->
                <option value="kyiv">Київ</option>
                <option value="lviv">Львів</option>
                <option value="chernivtsi" selected>Чернівці</option> <!--[cite: 37] -->
                <option value="odesa">Одеса</option>
                <option value="kharkiv">Харків</option>
            </select>

            <!-- Список з multiple на 6 значень[cite: 37] -->
            <label for="langs">Мови (множинний вибір, 6 значень):</label>
            <select name="languages" id="langs" multiple size="4" tabindex="17"> <!--[cite: 37, 38] -->
                <option value="ua">Українська</option>
                <option value="en">Англійська</option>
                <option value="pl">Польська</option>
                <option value="de">Німецька</option>
                <option value="fr">Французька</option>
                <option value="es">Іспанська</option>
            </select>

            <!-- Список з 4 optgroup по 3 значення[cite: 37] -->
            <label for="courses">Оберіть курс (групування):</label>
            <select name="course_selection" id="courses" tabindex="18"> <!--[cite: 38] -->
                <optgroup label="Програмування"> <!--[cite: 37] -->
                    <option value="c1">C++</option>
                    <option value="c2">Python</option>
                    <option value="c3">Java</option>
                </optgroup>
                <optgroup label="Дизайн">
                    <option value="d1">Figma</option>
                    <option value="d2">Photoshop</option>
                    <option value="d3">Illustrator</option>
                </optgroup>
                <optgroup label="Мережі">
                    <option value="n1">Cisco</option>
                    <option value="n2">MikroTik</option>
                    <option value="n3">Linux</option>
                </optgroup>
                <optgroup label="Бази даних">
                    <option value="db1">MySQL</option>
                    <option value="db2">PostgreSQL</option>
                    <option value="db3">MongoDB</option>
                </optgroup>
            </select>

            <!-- Поле з підказками datalist[cite: 37] -->
            <label for="browser">Улюблений браузер (Datalist):</label>
            <input list="browsers" name="browser_choice" id="browser" tabindex="19" placeholder="Почніть вводити..."> <!--[cite: 38] -->
            <datalist id="browsers"> <!--[cite: 37] -->
                <option value="Chrome">
                <option value="Firefox">
                <option value="Safari">
                <option value="Edge">
                <option value="Opera">
            </datalist>
        </fieldset>

        <!-- Блок 4: Файли та коментарі -->
        <fieldset>
            <legend>Файли та Коментарі</legend> <!--[cite: 38] -->

            <label for="comments">Залиште відгук:</label>
            <textarea name="user_comment" id="comments" rows="4" placeholder="Напишіть щось..." tabindex="20"></textarea> <!--[cite: 37, 38] -->

            <!-- Завантаження файлів (тільки аудіо, декілька)[cite: 37] -->
            <label for="audiofile">Завантажте ваші аудіофайли:</label>
            <input type="file" name="audio_upload" id="audiofile" accept="audio/*" multiple tabindex="21"> <!--[cite: 37, 38] -->
        </fieldset>

        <!-- Блок 5: Кнопки -->
        <div class="form-buttons">
            <input type="submit" name="btn_submit" value="Відправити дані" tabindex="22"> <!--[cite: 37, 38] -->
            <input type="reset" name="btn_reset" value="Очистити форму" tabindex="23"> <!--[cite: 37, 38] -->
        </div>

    </form>
</body>
</html>
