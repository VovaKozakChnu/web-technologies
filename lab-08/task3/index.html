<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 3 — Фотогалерея</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="gallery">
        <!-- Верхній ряд (5 фото) -->
        <div class="gallery__item"><img src="https://picsum.photos/400/300?random=1" alt="Фото 1"></div>
        <div class="gallery__item"><img src="https://picsum.photos/400/300?random=2" alt="Фото 2"></div>
        <div class="gallery__item"><img src="https://picsum.photos/400/300?random=3" alt="Фото 3"></div>
        <div class="gallery__item"><img src="https://picsum.photos/400/300?random=4" alt="Фото 4"></div>
        <div class="gallery__item"><img src="https://picsum.photos/400/300?random=5" alt="Фото 5"></div>

        <!-- Центральне велике фото -->
        <div class="gallery__item gallery__item--wide">
            <img src="https://picsum.photos/1200/500?random=6" alt="Панорамне фото">
        </div>

        <!-- Нижній ряд (5 фото) -->
        <div class="gallery__item"><img src="https://picsum.photos/400/300?random=7" alt="Фото 7"></div>
        <div class="gallery__item"><img src="https://picsum.photos/400/300?random=8" alt="Фото 8"></div>
        <div class="gallery__item"><img src="https://picsum.photos/400/300?random=9" alt="Фото 9"></div>
        <div class="gallery__item"><img src="https://picsum.photos/400/300?random=10" alt="Фото 10"></div>
        <div class="gallery__item"><img src="https://picsum.photos/400/300?random=11" alt="Фото 11"></div>
    </main>
</body>
</html>
